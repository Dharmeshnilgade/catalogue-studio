name: Build Windows and Android
on: [push, workflow_dispatch]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Create app files from index.html
        shell: bash
        run: |
          cat > package.json <<'EOF'
          {
            "name": "threadline-b2b-catalogue",
            "version": "2.0.0",
            "description": "Threadline B2B Catalogue",
            "author": "Threadline B2B",
            "main": "main.js",
            "devDependencies": { "electron": "^31.0.0", "electron-builder": "^24.13.3" },
            "build": {
              "appId": "com.threadline.b2b",
              "productName": "Threadline B2B Catalogue",
              "files": ["main.js", "preload.js", "index.html"],
              "win": { "target": ["nsis", "portable"] }
            }
          }
          EOF
          cat > main.js <<'EOF'
          const { app, BrowserWindow, ipcMain, dialog, shell } = require('electron');
          const path = require('path');
          const fs = require('fs');
          ipcMain.handle('save', async (e, name, b64) => {
            const r = await dialog.showSaveDialog({ defaultPath: name });
            if (r.canceled || !r.filePath) return false;
            fs.writeFileSync(r.filePath, Buffer.from(b64, 'base64'));
            if (name.endsWith('.pdf')) shell.openPath(r.filePath); else shell.showItemInFolder(r.filePath);
            return true;
          });
          app.whenReady().then(() => {
            const win = new BrowserWindow({ width: 1100, height: 900, autoHideMenuBar: true, title: 'Threadline B2B Catalogue',
              webPreferences: { preload: path.join(__dirname, 'preload.js'), contextIsolation: true } });
            win.webContents.setWindowOpenHandler(({ url }) => { shell.openExternal(url); return { action: 'deny' }; });
            win.loadFile(path.join(__dirname, 'index.html'));
          });
          app.on('window-all-closed', () => app.quit());
          EOF
          cat > preload.js <<'EOF'
          const { contextBridge, ipcRenderer } = require('electron');
          contextBridge.exposeInMainWorld('desk', { save: (name, b64) => ipcRenderer.invoke('save', name, b64) });
          EOF
      - run: npm install
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/*.exe
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Create app files from index.html
        run: |
          mkdir -p www && cp index.html www/
          cat > package.json <<'EOF'
          {
            "name": "threadline-b2b-catalogue",
            "version": "2.0.0",
            "dependencies": {
              "@capacitor/android": "^6.1.2",
              "@capacitor/core": "^6.1.2",
              "@capacitor/filesystem": "^6.0.1",
              "@capacitor/share": "^6.0.2"
            },
            "devDependencies": { "@capacitor/cli": "^6.1.2" }
          }
          EOF
          cat > capacitor.config.json <<'EOF'
          { "appId": "com.threadline.b2b", "appName": "Threadline B2B", "webDir": "www" }
          EOF
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
